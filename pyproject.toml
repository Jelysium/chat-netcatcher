[project]
name = "chat-netcatcher"
version = "0.1.0"
description = "Network packet capture and HTTP/HTTPS monitoring tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "mitmproxy>=12.2.2",
    "pyqt6>=6.11.0",
    "pyqt6-charts>=6.11.0",
    "scapy>=2.7.0",
]

[project.scripts]
chat-netcatcher = "netcatcher.app:main"
cnc = "netcatcher.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netcatcher"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
